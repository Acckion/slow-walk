name: Swift Core

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows SwiftPM
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      SWIFT_VERSION: "6.3.3"
      SLOWWALK_SCRATCH_ROOT: ${{ runner.temp }}\slowwalk-swiftpm

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Swift
        shell: pwsh
        run: |
          winget install `
            --id Swift.Toolchain `
            --exact `
            --version $env:SWIFT_VERSION `
            --source winget `
            --accept-package-agreements `
            --accept-source-agreements `
            --disable-interactivity `
            --force

          $swiftExecutable = Get-ChildItem `
            -LiteralPath "$env:LOCALAPPDATA\Programs\Swift" `
            -Filter "swift.exe" `
            -Recurse `
            -File |
            Where-Object { $_.FullName -match [regex]::Escape($env:SWIFT_VERSION) } |
            Select-Object -First 1

          if ($null -eq $swiftExecutable) {
            throw "Swift $env:SWIFT_VERSION executable was not found after installation."
          }

          Split-Path -Parent $swiftExecutable.FullName |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build and test core
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\verify-windows.ps1 -SkipServer

