name: Swift Core

on:
  push:
    branches:
      - develop
      - "feature/**"
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Ubuntu SwiftPM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:6.3.2-jammy

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Resolve core dependencies
        working-directory: swift-packages/SlowWalkCore
        run: swift package resolve

      - name: Build core
        working-directory: swift-packages/SlowWalkCore
        run: swift build

      - name: Test core
        working-directory: swift-packages/SlowWalkCore
        run: swift test
